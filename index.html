    const ae = document.activeElement;
    const focus = ae && ae.tagName === "TEXTAREA" && ae.id ? { id: ae.id, a: ae.selectionStart, b: ae.selectionEnd } : null;
    let html = "";
    if (state.error && !state.loaded) html = `<div class="notice error"><b>Can't read your Job Tracker.</b> ${esc(errorCopy(state.error, S_SHEETS))}</div>`;
    else if (!state.loaded) html = `<div class="section"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`;
    else {
      if (state.error) html += `<div class="notice error" style="margin-bottom:16px">${esc(errorCopy(state.error, S_SHEETS))} Showing the data from ${fmtTime(state.syncedAt)}.</div>`;
      html += state.view === "app" ? viewApp() : state.view === "browse" ? viewBrowse() : state.view === "matches" ? viewMatches() : state.view === "applied" ? viewApplied()
        : state.view === "waiting" ? viewWaiting() : state.view === "insights" ? viewInsights() : viewLatest();
    }
    main.innerHTML = html;
    if (fq != null) { const i = $("#f-q"); if (i) { i.focus(); try { i.setSelectionRange(fq, fq); } catch (e) {} } }
    if (focus && focus.id) { const el = document.getElementById(focus.id); if (el && !el.disabled) { el.focus(); try { el.setSelectionRange(focus.a, focus.b); } catch (e) {} } }
    afterRender();
  }

  // On the application page: fetch previews, and poll the sheet every 30 s while Claude is working.
  let pollTimer = null;
  function afterRender() {
    const r = state.view === "app" && state.loaded ? state.rows.find(x => x.row === state.appRow) : null;
    if (r && r.has) { ensurePreview(r, "resume"); ensurePreview(r, "cover"); }
    const busy = !!(r && (r.tailoring || r.revising));
    if (busy && !pollTimer) pollTimer = setInterval(() => { if (!document.hidden) refresh(); }, 30000);
    if (!busy && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function route() {
    const h = (location.hash || "").slice(1);
    const m = h.match(/^app\/(\d+)$/);
    state.zoom = null;
    if (m) { state.view = "app"; state.appRow = +m[1]; window.scrollTo(0, 0); }
    else { state.view = ["latest", "browse", "matches", "applied", "waiting", "insights"].includes(h) ? h : "latest"; state.back = state.view; }
    render();
  }
  window.addEventListener("hashchange", route);

  // ---------- events ----------
  const findRow = (n) => state.rows.find(r => r.row === +n);
  document.addEventListener("click", (e) => {
    const z = e.target.closest("[data-zoom], [data-zoom-close]");
    if (z) { state.zoom = z.dataset.zoom || null; render(); return; }
    const t = e.target.closest("button, [data-expand]"); if (!t) return;
    if (t.matches("[data-expand]")) { t.classList.toggle("clamp"); return; }
    if (t.id === "refresh") { refresh(); return; }
    if (t.dataset.create) { const r = findRow(t.dataset.create); if (r) { location.hash = "#app/" + r.row; createDocs(r); } return; }
    if (t.dataset.go) { const r = findRow(t.dataset.go); if (r) createDocs(r); return; }
    if (t.dataset.fresh) { const r = findRow(t.dataset.fresh); if (r) freshen(r, state.drafts[r.row]); return; }
    if (t.dataset.suggest) { const n = t.dataset.for; const cur = (state.drafts[n] || "").trim();
      state.drafts[n] = cur ? `${cur}${/[.!?]$/.test(cur) ? "" : "."} ${t.dataset.suggest}.` : `${t.dataset.suggest}.`; render();
      const ta = document.getElementById("fresh-" + n); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } return; }
    if (t.dataset.status) { const r = findRow(t.dataset.row); if (r) setStatus(r, t.dataset.status); return; }
    if (t.dataset.dl) { const r = findRow(t.dataset.row); if (r) downloadPdf(r, t.dataset.dl, t.dataset.name, t); return; }
    if (t.dataset.mail) { const r = findRow(t.dataset.mail); if (r) checkMail(r); return; }
    if (t.dataset.range) { state.browse.range = t.dataset.range; render(); return; }
    if (t.dataset.mrange) { state.matches.range = t.dataset.mrange; render(); return; }
    if (t.dataset.tier) { const n = t.dataset.tier, cur = state.matches.tiers;
      state.matches.tiers = cur.includes(n) ? cur.filter(x => x !== n) : TIERS.map(x => x[0]).filter(x => x === n || cur.includes(x)); saveTiers(); render(); return; }
    if (t.dataset.tierset) { state.matches.tiers = t.dataset.tierset.split("|"); saveTiers(); render(); return; }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "f-status") { state.browse.status = t.value; render(); }
    if (t.id === "f-mstatus") { state.matches.status = t.value; render(); }
    if (t.dataset.move && t.value) { const r = findRow(t.dataset.move); if (r) setStatus(r, t.value); }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "f-q") { state.browse.q = e.target.value; clearTimeout(render._q); render._q = setTimeout(render, 150); }
    if (e.target.dataset && e.target.dataset.draft) state.drafts[e.target.dataset.draft] = e.target.value;
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.zoom) { state.zoom = null; render(); return; }
    const t = e.target; if (!(t.dataset && t.dataset.draft) || e.key !== "Enter" || !(e.metaKey || e.ctrlKey)) return;
    e.preventDefault(); const r = findRow(t.dataset.draft); if (r) freshen(r, t.value);
  });

  // ---------- theme ----------
  const themeBtn = $("#themeBtn");
  function syncTheme() { const light = document.documentElement.dataset.theme === "light";
    themeBtn.textContent = light ? "Dark mode" : "Light mode"; themeBtn.setAttribute("aria-pressed", String(light)); }
  themeBtn.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next; try { localStorage.setItem("theme", next); } catch (e) {} syncTheme();
  });
  syncTheme();

  // ---------- boot ----------
  if (CFG.brand) { $("#brandName").textContent = CFG.brand; $("#brandTag").textContent = CFG.tagline || ""; }
  route();
  (async () => {
    const c = window.claude;
    if (!c || !c.use) { state.error = { code: "not_granted" }; render(); return; }
    [mcp, downloads] = await Promise.all([c.use("mcp"), c.use("downloads")]);
    if (!mcp) { state.error = { code: "not_granted" }; render(); return; }
    startWatch();
  })();
})();
</script>
</body>
</html>
